# Render deployment settings (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: health-risk-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Gunicorn is a production server; Flask's built-in server is only for local development
    startCommand: gunicorn "app:create_app()"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: GEMINI_API_KEY
        sync: false # entered in the Render dashboard, never stored in the repository
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_CALLS_PER_MINUTE
        value: "10"
      - key: FLASK_DEBUG
        value: "0"
